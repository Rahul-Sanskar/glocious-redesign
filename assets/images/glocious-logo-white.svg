<svg xmlns="http://www.w3.org/2000/svg" width="2167" height="725" viewBox="0 0 2167 725" role="img" aria-labelledby="title2 desc2">
  <title id="title2">Glocious</title>
  <desc id="desc2">Multicoloured geometric ribbon emblem and white Glocious wordmark.</desc>
  <defs>
    <linearGradient id="blue2" x1="0" y1="0" x2="1" y2=".3"><stop stop-color="#7edcff"/><stop offset="1" stop-color="#0798e8"/></linearGradient>
    <linearGradient id="yellow2" x1="0" y1="0" x2="1" y2=".5"><stop stop-color="#ffe17b"/><stop offset="1" stop-color="#ffad00"/></linearGradient>
    <linearGradient id="pink2" x1="0" y1="0" x2=".1" y2="1"><stop stop-color="#e90083"/><stop offset=".7" stop-color="#f00078"/><stop offset="1" stop-color="#ffb4c9"/></linearGradient>
    <linearGradient id="green2" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#00a94f"/><stop offset="1" stop-color="#00a33c"/></linearGradient>
    <linearGradient id="gray2" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d0d0d0"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="red2" x1="0" y1="0" x2="1" y2=".4"><stop stop-color="#ff3975"/><stop offset=".55" stop-color="#f00043"/><stop offset="1" stop-color="#c90037"/></linearGradient>
    <linearGradient id="redTop2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffa3bd"/><stop offset="1" stop-color="#ed6a8d"/></linearGradient>
  </defs>
  <!-- Multicolour geometric emblem — identical colours -->
  <g stroke="none">
    <path d="M58 197 L289 66 L289 178 L158 251 Z" fill="url(#blue2)"/>
    <path d="M289 66 L492 180 L492 293 L289 178 Z" fill="url(#yellow2)"/>
    <path d="M289 161 L492 274 L492 293 L289 178 Z" fill="#e99c00" opacity=".35"/>
    <path d="M58 197 L158 251 L155 401 L58 447 Z" fill="url(#pink2)"/>
    <path d="M58 197 L158 251 L158 270 L58 217 Z" fill="#ff4a9b" opacity=".25"/>
    <path d="M155 401 L284 470 L284 584 L58 458 Z" fill="url(#green2)"/>
    <path d="M284 470 L492 411 L492 465 L284 584 Z" fill="url(#gray2)"/>
    <path d="M288 238 L492 350 L492 466 L288 354 Z" fill="url(#red2)"/>
    <path d="M288 238 L492 350 L492 384 L288 323 Z" fill="url(#redTop2)"/>
    <path d="M288 323 L492 384 L492 466 L288 354 Z" fill="#c9003c" opacity=".15"/>
  </g>
  <!-- Wordmark in white for use over dark/video backgrounds -->
  <text x="558" y="472" fill="#ffffff" font-family="Didot, 'Bodoni 72', 'Times New Roman', Georgia, serif" font-size="430" font-weight="400" letter-spacing="-11">Glocious</text>
